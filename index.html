<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        form { max-width: 400px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%; padding: 8px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>Create an Account</h2>
    
    <form action="/submit-registration" method="POST">
        <div>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
        </div>

        <div>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div>
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label style="display:inline" for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label style="display:inline" for="female">Female</label>
        </div>

        <div>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="ethiopia">Ethiopia</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>
        </div>

        <button type="submit" style="background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer;">
            Register Now
        </button> 
        <a href=" finalproject.html">back to the home page</a> 
    </form>

</body>
</html>
